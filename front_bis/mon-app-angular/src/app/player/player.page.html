<header class="navbar navbar-dark bg-primary p-3">
  <button (click)="goBack()" class="btn btn-light">← Retour</button>
  <h1 class="text-white mx-auto">Lecture vidéo</h1>
</header>

<main class="container mt-4">
  <p *ngIf="loading" class="text-center" role="status">Préparation de la vidéo…</p>

  <div class="track-controls" *ngIf="!loading && !errorMessage">
    <label *ngIf="audioTracks.length > 1">
      Langue audio
      <select [value]="selectedAudioTrack" (change)="onAudioTrackChange($event)">
        <option *ngFor="let track of audioTracks" [value]="track.index">
          {{ track.label }}
        </option>
      </select>
    </label>

    <label *ngIf="subtitleTracks.length">
      Sous-titres
      <select [value]="selectedSubtitleTrack" (change)="onSubtitleTrackChange($event)">
        <option value="-1">Désactivés</option>
        <option *ngFor="let track of subtitleTracks; let index = index" [value]="index">
          {{ track.label }}
        </option>
      </select>
    </label>
  </div>

  <div class="video-container">
    <video
      #videoElement
      controls
      autoplay
      playsinline
      class="w-100"
      (loadedmetadata)="loading = false"
      (error)="onVideoError()">
      <track
        *ngFor="let track of subtitleTracks"
        kind="subtitles"
        [src]="track.url"
        [srclang]="track.language"
        [label]="track.label">
    </video>
  </div>

  <p *ngIf="languageChangeMessage" class="text-muted text-center">
    {{ languageChangeMessage }}
  </p>
  <p *ngIf="errorMessage" class="text-danger text-center" role="alert">
    {{ errorMessage }}
  </p>
</main>
